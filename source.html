<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Source Code · Bus Route Fare Splitter</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .source-page { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    .file-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .file-tabs button {
      background: white;
      border: 1px solid #ccc;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .file-tabs button.active { background: #1e3c72; color: white; border-color: #1e3c72; }
    .source-block {
      background: #1e1e1e;
      color: #e6e6e6;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 70vh;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      white-space: pre;
    }
    .source-block .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      color: #aaa;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚌 Source Code</h1>
    <p class="subtitle">The complete source for the Bus Route Fare Splitter.</p>
    <nav>
      <a href="index.html">App</a>
      <a href="source.html" class="active">Source Code</a>
    </nav>
  </header>

  <main class="source-page">
    <div class="file-tabs" id="file-tabs"></div>
    <div class="source-block">
      <div class="file-header">
        <span id="current-file">index.html</span>
        <button id="copy-btn" class="btn small">Copy</button>
      </div>
      <code id="source-content">Loading&hellip;</code>
    </div>
  </main>

  <footer>
    <p><a href="index.html">← Back to the app</a></p>
  </footer>

  <script>
    const files = ['index.html', 'styles.css', 'app.js', 'manifest.json', 'service-worker.js', 'vercel.json', 'api/trips.js', 'tests.html', 'README.md'];
    let current = files[0];
    let sources = {};

    async function loadAll() {
      const tabs = document.getElementById('file-tabs');
      files.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.textContent = f;
        if (i === 0) btn.classList.add('active');
        btn.addEventListener('click', () => {
          current = f;
          document.querySelectorAll('.file-tabs button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          showSource();
        });
        tabs.appendChild(btn);
      });

      for (const f of files) {
        try {
          const res = await fetch(f);
          sources[f] = await res.text();
        } catch (e) {
          sources[f] = `// Failed to load ${f}: ${e.message}\n// Tip: open source.html via a local web server (e.g. \`npx serve\` or VS Code Live Server), not as file://`;
        }
      }
      showSource();
    }

    function showSource() {
      document.getElementById('current-file').textContent = current;
      const el = document.getElementById('source-content');
      el.textContent = sources[current] || '// (empty)';
    }

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(sources[current] || '');
        const btn = document.getElementById('copy-btn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1200);
      } catch (e) {
        alert('Copy failed: ' + e.message);
      }
    });

    loadAll();
  </script>
</body>
</html>
